# Add this location inside the development server's EXISTING HTTPS server block.
# The server administrator provides a trusted TLS certificate for its host/IP.
# This leaves the other Bored Owl API routes under their existing locations.
location /csit321/ {
    client_max_body_size 8m;
    proxy_pass http://127.0.0.1:8001/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# Sign-in: limit password attempts per client address. The gateway also limits
# failed attempts per username, but behind this proxy it cannot see client IPs.
# Put this line in the http {} context (e.g. /etc/nginx/conf.d/csit321-limits.conf):
#   limit_req_zone $binary_remote_addr zone=csit321_login:10m rate=10r/m;
location = /csit321/v1/auth/login {
    limit_req zone=csit321_login burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8001/v1/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
