# Add this location inside the development server's EXISTING HTTPS server block.
# The server administrator provides a trusted TLS certificate for its host/IP.
# This leaves the other Bored Owl API routes under their existing locations.
location /csit321/ {
    client_max_body_size 8m;
    proxy_pass http://127.0.0.1:8001/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
