# Transfer client: SQLite -> authenticated gateway. No PostgreSQL credentials.
# Live HTTPS URL/certificate must be confirmed with the server administrator.
[local]
path = "~/katdata.db"
batch_size = 500
busy_timeout_s = 10.0

[remote]
kind = "gateway"
url = "http://127.0.0.1:8080"
token = "${KAT_API_WRITE_TOKEN}"
timeout_s = 30
# For a private TLS authority, set ca_file = "path/to/boredowl-ca.pem".

[zmq]
# Listen for KAT notifications; the sweep still runs if none arrive.
enabled = true
endpoint = "tcp://127.0.0.1:5556"
topics = [""]
bind = false

[service]
sweep_interval_s = 10.0
notify_debounce_s = 0.5
# Change to "real" only when the selected database contains data to keep.
origin = "fake"
retry_base_s = 2.0
retry_max_s = 60.0
log_level = "INFO"
