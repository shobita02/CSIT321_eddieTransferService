# kat-transfer configuration
#
# Copy to config.toml and edit. Paths are relative to this file.
# Anything of the form ${VAR} is read from the environment, which is how
# credentials stay out of git.

[local]
# The KAT SQLite database on this machine. When the real KAT is installed,
# point this at the file it creates instead of the generated one.
path = "data/kat.sqlite"
batch_size = 500
busy_timeout_s = 10.0

[remote]
# "sqlite" runs against a local stand-in for the Bored Owl server, which is
# what you want until VPN access and credentials exist.
# Change to "postgres" and fill in the block below to go live.
kind = "sqlite"
path = "data/remote_mock.sqlite"

# --- used when kind = "postgres" ---
host = "192.168.40.100"
port = 5432
database = "csit321"
user = "${KAT_PG_USER}"
password = "${KAT_PG_PASSWORD}"
sslmode = "prefer"
connect_timeout_s = 10

[zmq]
# KAT publishes; we subscribe. Set enabled = false to run on the sweep alone,
# which is a useful way to prove the service does not depend on 0MQ.
enabled = true
endpoint = "tcp://127.0.0.1:5556"
# Prefix filters. [""] means everything. Narrow it once KAT's topic names are
# confirmed, e.g. ["kat.experimentaldata", "kat.environment"].
topics = [""]
bind = false

[service]
# Safety net. Even with notifications working, the service re-checks for
# untransferred rows this often. Lower it for a demo, raise it in production.
sweep_interval_s = 10.0
# After a notification wakes it, the service keeps absorbing notifications for
# this long before transferring, so a burst of per-row notifications becomes one
# batch instead of one transaction per row. Set to 0 to transfer immediately.
notify_debounce_s = 0.5
# Stamps every row this service ships. Use "fake" while testing against
# generated data so the archive can tell real runs from synthetic ones.
origin = "fake"
retry_base_s = 2.0
retry_max_s = 60.0
log_level = "INFO"
