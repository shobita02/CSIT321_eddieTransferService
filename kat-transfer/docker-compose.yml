# Local demo: NGINX is the only published service. PostgreSQL stays private.
name: kat-gateway-dev
services:
  remote-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${KAT_PG_DATABASE:-csit321}
      POSTGRES_USER: ${KAT_PG_USER:-kat}
      POSTGRES_PASSWORD: ${KAT_PG_PASSWORD:?Create .env with tools/new_demo_env.py}
    volumes:
      - kat-gateway-pg-data:/var/lib/postgresql/data
      - ./schema/remote_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  gateway:
    build: .
    restart: unless-stopped
    environment:
      KAT_PG_HOST: remote-db
      KAT_PG_DATABASE: ${KAT_PG_DATABASE:-csit321}
      KAT_PG_USER: ${KAT_PG_USER:-kat}
      KAT_PG_PASSWORD: ${KAT_PG_PASSWORD:?Create .env}
      KAT_PG_SSLMODE: disable
    depends_on:
      remote-db:
        condition: service_healthy
  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
volumes:
  kat-gateway-pg-data:
